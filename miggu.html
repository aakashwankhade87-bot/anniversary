<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .frame {
            width: min(100vw, calc(100vh * 9 / 16));
            aspect-ratio: 9 / 16;
            overflow: hidden;
            background: black;
        }

        .frame img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Change to 'contain' if you don't want cropping */
        }
    </style>
</head>
<body>

    <div class="frame">
        <img src="main.png" alt="Image">
    </div>

</body>
</html>
